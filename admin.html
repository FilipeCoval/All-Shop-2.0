<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="All-Shop Admin" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="manifest" href="/admin.webmanifest" />
    <link rel="icon" type="image/png" href="https://i.imgur.com/nSiZKBf.png" />
    <link rel="apple-touch-icon" href="https://i.imgur.com/nSiZKBf.png" />
    <script>
      try {
        const savedTheme = localStorage.getItem('theme');
        const wantsDark = savedTheme === 'dark'
          || (!savedTheme && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', wantsDark);
      } catch {}
    </script>
    <title>Administração | All-Shop</title>
  </head>
  <body>
    <div id="admin-root"></div>
    <script type="module" src="/admin-entry.tsx"></script>
  </body>
</html>
